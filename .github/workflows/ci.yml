# .github/workflows/ci.yml
name: NED CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: '0.10.9'

jobs:
  # ----- STAGE 1: PARALLEL STATIC CHECKS -----
  # Each job syncs the dev tools from uv.lock, so CI runs exactly the versions
  # pinned in pyproject.toml and cannot drift from local.
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check

  format_check:
    name: Ruff Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff format --check --diff

  spell_check:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --only-group dev
      # Bare invocation so [tool.codespell] in pyproject.toml supplies the
      # skip list and ignore_words.txt.
      - run: uv run --no-sync codespell

  # ----- STAGE 2: TESTING -----
  test:
    name: Run Tests
    needs: [lint, format_check, spell_check]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-default-groups
      - name: Build database from source
        run: |
          uv run --no-sync python manage.py migrate
          uv run --no-sync python manage.py ingest
      - name: Run tests
        run: uv run --no-sync python manage.py test ned_app.tests

  ui_test:
    name: Run UI Tests
    needs: [lint, format_check, spell_check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --only-group ui --only-group dev
      - name: Run UI tests
        run: uv run --no-sync python -m pytest ui/tests -q
