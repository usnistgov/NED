# Dependabot follows uv.lock, so a bump updates pyproject.toml and the lock
# together. The pinned requirements.txt for the front-end is generated from the
# lock at publish time and never committed here, so there is nothing else to
# regenerate on a Dependabot branch.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
