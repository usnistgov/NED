[project]
name = "ned"
version = "0.1.0"
description = "Nonstructural Element Database: Django backend and Streamlit frontend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2.0,<6",
    "djangorestframework>=3.14.0",
    "django-extensions>=4.1",
    "jsonschema>=4.0.0",
]

# Development-time groups introduce sets of tools to sync into the environment.
# Both are default groups, so a plain `uv sync` gives a contributor everything.
# ruff, codespell and pytest are pinned exactly: a new version changes what
# the CI gate reports, so be careful with bumping these.
[dependency-groups]
dev = [
    "ruff==0.12.9",
    "codespell==2.4.3",
    "pytest==9.0.3",
]
ui = [
    "streamlit==1.58.0",
    "pandas",
    "numpy",
    "plotly",
]

[tool.uv]
package = false
default-groups = ["dev", "ui"]

[tool.codespell]
ignore-words = "ignore_words.txt"
skip = [
    "*/ned_app/fixtures/*",
    "*/ned_app/migrations/*",
    "*/ned_proj/*",
    "*/resources/*",
    "*/venv/*",
    'fair-software.md'
]
check-filenames = true
check-hidden = false
count = true
quiet-level = 2

[tool.ruff]
line-length = 85
preview = true
extend-exclude = [
    "resources/",
]

[tool.ruff.lint]
ignore = [
    "D211",
    "D212",
    "Q000",
    "Q003",
    "COM812",
    "D203",
    "ISC001",
    "E501",
    "ERA001",
    "PGH003",
    "FIX002",
    "TD003",
    "S101",
    "N801",
    "S311",
    "G004",
    "SIM102",
    "SIM108",
    "NPY002",
    "F401",
    "TRY003",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 15
max-locals = 50
max-returns = 11
max-branches = 50
max-statements = 150
max-bool-expr = 5
